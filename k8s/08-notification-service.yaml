apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: rabbitmq-idempotency
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7073
          envFrom:
            - configMapRef:
                name: rabbit-mq-config
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: app-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: rabbitmq-idempotency
spec:
  selector:
    app: notification-service
  ports:
    - port: 7073
      targetPort: 7073
  type: NodePort